# Push a tag like v0.1.0 (matching package.json) and this builds zcash-devtool for 5 platforms,
# attaches the binaries to a GitHub release, writes their sha256 into checksums.json and publishes to npm.
# The CLI refuses any download whose hash doesn't match the checksums.json inside the npm package.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build only (no release), to check the matrix still compiles

env:
  DEVTOOL_REV: 0b3436bb8d235c67cd36b800cb45a7b1b489c415 # same rev the faucet server runs

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: zcash-devtool-linux-x64 } # older glibc = runs on more distros
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: zcash-devtool-linux-arm64 }
          - { os: macos-14, target: aarch64-apple-darwin, asset: zcash-devtool-darwin-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, asset: zcash-devtool-darwin-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: zcash-devtool-win32-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out zcash-devtool
        shell: bash
        run: git clone https://github.com/zcash/zcash-devtool src && git -C src checkout "$DEVTOOL_REV"
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src, key: "${{ matrix.target }}" }
      - name: Build
        shell: bash
        working-directory: src
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --features qr --bin zcash-devtool --target ${{ matrix.target }}
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/zcash-devtool$ext" "../${{ matrix.asset }}"
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' # cross-built on an arm runner
        shell: bash
        run: ./${{ matrix.asset }} --help > /dev/null
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.asset }}", path: "${{ matrix.asset }}" }

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - name: Tag must match package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Write checksums.json
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const out = {};
            for (const f of fs.readdirSync("dist").sort()) out[f] = crypto.createHash("sha256").update(fs.readFileSync("dist/" + f)).digest("hex");
            fs.writeFileSync("checksums.json", JSON.stringify(out, null, 2) + "\n");
            console.log(out);'
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* checksums.json --title "$GITHUB_REF_NAME" --notes "zcash-devtool @ $DEVTOOL_REV, built with --features qr."
      - name: Publish to npm
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: npm test && npm publish --provenance --access public
